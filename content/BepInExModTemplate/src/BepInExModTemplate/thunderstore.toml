[config]
schemaVersion = "0.0.1"

[general]
repository = "https://thunderstore.io"

[package]
namespace = "_ts-team_"
name = "BepInExModTemplate"
description = "TODO: Fill in a short Mini Cozy Room: Lo-Fi mod description."
websiteUrl = "" # TODO: Add a link to your Mini Cozy Room: Lo-Fi mod repository here (optional)
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack = "5.4.2403"

[build]
icon = "../../icon.png"
readme = "../../README.md"
outdir = "../../artifacts/thunderstore/"

[[build.copy]]
source = "../../artifacts/bin/BepInExModTemplate/release/_Guid_.dll"
target = "plugins/"

[[build.copy]]
source = "../../CHANGELOG.md"
target = "/"

[[build.copy]]
source = "../../LICENSE"
target = "/"

# The following config options only apply when using TCLI to publish to Thunderstore directly:

[publish]
# Replace this placeholder after confirming the correct Thunderstore community slug.
# See communities at:
# https://thunderstore.io/api/experimental/community/
communities = [ "_ThunderstoreGameIdentifier_", ]

[publish.categories]
# See categories at:
# https://thunderstore.io/api/experimental/community/_ThunderstoreGameIdentifier_/category/
_ThunderstoreGameIdentifier_ = [ "mods", ]
